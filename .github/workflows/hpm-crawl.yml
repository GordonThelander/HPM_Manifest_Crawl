name: HPM Manifest Crawl

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'hpm_package_index.json'
      - 'hubitat_official_docs_index.json'
      - 'registry_validation_report.md'
      - 'community_packages.json'
      - 'definitions.json'
      - 'package_health.json'
      - 'package_feed_state.json'
      - 'package_changes.json'
      - 'package_changes.atom'
      - 'package_changes_weekly.md'
      - 'site/package-feed/index.html'
      - 'site/package-feed/data/package_changes.json'
      - 'site/package-feed/data/package_changes.atom'
      - 'site/package-feed/data/package_changes_weekly.md'
      - 'health_monitor.json'
      - 'health_summary.md'
      - 'link_reachability.json'
      - 'site/identity-resolver/data/identity_index.json'
      - 'site/identity-resolver/data/identity_index.js'
      - 'network_evidence.json'
      - 'site/network-guide/data/network_evidence.js'
      - 'contributor_activity.json'
      - 'site/contributors/data/contributor_activity.js'
      - 'site/package-explorer/data/explorer_index.json'
      - 'site/package-explorer/data/explorer_index.js'
      - 'hpm_taxonomy.json'
      - 'hpm_taxonomy_fallback.json'
      - 'site/taxonomy/data/hpm_taxonomy.json'
      - 'site/taxonomy/data/hpm_taxonomy.js'
      - 'hubitat_release_features.json'
      - 'site/feature-tracker/data/hubitat_release_features.json'
      - 'site/feature-tracker/data/hubitat_release_features.js'
      - 'site_status.json'
      - 'site/about/data/site_status.json'
      - 'site/about/data/site_status.js'
      - 'official_devices.json'
      - 'community_drivers.json'
      - 'community_apps.json'
      - 'site/packages/**'
      - 'site/authors/**'
      - 'site/updates/**'
      - 'site/sitemap.xml'
  pull_request:
    branches: [main]
  schedule:
    # Runs daily at 00:00 GMT/UTC. The full crawl only follows if the cheap
    # upstream check says something actually moved; a few independent
    # catalogue, taxonomy and release-note builders still refresh every run.
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Run the full crawl even if upstream is unchanged'
        type: boolean
        default: false

# A push to main and a manual/scheduled dispatch can otherwise overlap: both
# would crawl independently and race to push "Commit generated outputs",
# and the loser's push is rejected as a non-fast-forward. Queueing instead of
# cancelling means neither run's work is thrown away.
concurrency:
  group: hpm-crawl-main
  cancel-in-progress: false

jobs:
  automation-map-contract:
    name: Automation Map contract
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify frozen consumer contract
        run: |
          python -m unittest discover -s tests -v
          python build_slim_registry.py --check
          python automation_map_contract.py
          python build_community_datasets.py --check
          python build_health_monitor.py --check
          python probe_package_links.py --check
          python build_identity_resolver.py --check
          python build_package_feed.py --check
          python build_network_guide.py --check
          python build_package_explorer.py --check
          python build_hpm_taxonomy.py --check
          python build_release_features.py --check
          python build_site_status.py --check
          python build_site_discovery.py --check
          python harvest_catalogues.py --check

  crawl:
    # Branch and pull-request builds exercise the contract job without running
    # the expensive network crawl or the main-only publication path.
    if: github.ref == 'refs/heads/main'
    needs: automation-map-contract
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      pushed: ${{ steps.commit.outputs.pushed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A full crawl is ~3,000 requests against a volunteer-run CDN. This is
      # 217, and answers whether any of them would find anything new.
      - name: Check whether upstream changed
        id: upstream
        run: python check_upstream.py

      - name: Restore acquisition caches
        uses: actions/cache@v4
        with:
          path: |
            .hpm_cache
            .hubitat_docs_cache
          key: enrichment-cache-v3-${{ hashFiles('crawl_hpm.py', 'enrich_hpm_sources.py', 'enrich_hubitat_docs.py') }}
          restore-keys: |
            enrichment-cache-v3-
            enrichment-cache-v2-
            hpm-cache-v1-

      - name: Validate inputs
        if: steps.upstream.outputs.changed == 'true' || github.event_name == 'push' || inputs.force
        shell: bash
        run: |
          set -euo pipefail
          test -f crawl_hpm.py
          test -f hubitat_automation_map_app_integration_registry.json
          python -m py_compile crawl_hpm.py apply_source_visibility.py enrich_hpm_sources.py enrich_hubitat_docs.py revalidate_enriched.py build_slim_registry.py build_community_datasets.py build_health_monitor.py probe_package_links.py build_identity_resolver.py build_package_feed.py build_network_guide.py build_package_explorer.py build_hpm_taxonomy.py build_release_features.py build_site_status.py build_site_discovery.py validate_hpm_package.py harvest_catalogues.py automation_map_contract.py
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('hubitat_automation_map_app_integration_registry.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          version = str(d.get('schemaVersion') or '').strip()
          if not version:
              raise SystemExit('canonical registry is missing schemaVersion')
          print(f'Canonical registry schemaVersion={version}')
          PY

      - name: Classify source visibility
        if: steps.upstream.outputs.changed == 'true' || github.event_name == 'push' || inputs.force
        run: python apply_source_visibility.py

      - name: Crawl HPM manifests and validate registry
        if: steps.upstream.outputs.changed == 'true' || github.event_name == 'push' || inputs.force
        run: python crawl_hpm.py

      - name: Enrich from public Groovy source
        if: steps.upstream.outputs.changed == 'true' || github.event_name == 'push' || inputs.force
        run: python enrich_hpm_sources.py

      - name: Enrich native entries from official Hubitat documentation
        if: steps.upstream.outputs.changed == 'true' || github.event_name == 'push' || inputs.force
        run: python enrich_hubitat_docs.py

      - name: Revalidate enriched evidence
        if: steps.upstream.outputs.changed == 'true' || github.event_name == 'push' || inputs.force
        run: python revalidate_enriched.py

      # The Hubitat app downloads and parses the registry inside a single
      # execution. The canonical file reached 165KB and killed that execution
      # silently, so the app gets a stripped copy and CI fails if it regrows.
      - name: Build slim registry for the Hubitat app
        if: steps.upstream.outputs.changed == 'true' || github.event_name == 'push' || inputs.force
        run: python build_slim_registry.py

      - name: Recheck Automation Map contract after generation
        if: steps.upstream.outputs.changed == 'true' || github.event_name == 'push' || inputs.force
        run: python automation_map_contract.py

      - name: Build community datasets
        if: steps.upstream.outputs.changed == 'true' || github.event_name == 'push' || inputs.force
        run: python build_community_datasets.py

      - name: Build authoritative HPM taxonomy and usage metrics
        run: python build_hpm_taxonomy.py

      # Release notes change independently of package metadata. Failure remains
      # non-blocking and atomic promotion preserves the last successful snapshot.
      - name: Build Hubitat platform feature tracker
        continue-on-error: true
        run: python build_release_features.py

      # For Gordon to check on request, not for the site: prints the site's
      # own Cloudflare Web Analytics page-view count to this job's log.
      # Nothing is written to disk or committed, so it can never affect what
      # gets published or trigger an unrelated redeploy.
      - name: Report Cloudflare Web Analytics traffic
        id: traffic
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
        run: |
          python - <<'PY'
          import datetime
          import json
          import os
          import urllib.request

          ACCOUNT_TAG = 'b35cacb1572babb9b03dcf6240d409fc'
          SITE_TAG = '119138f9a53e402fa5529b9d40799da4'  # gordonthelander.github.io
          WINDOW_DAYS = 30

          now = datetime.datetime.now(datetime.timezone.utc)
          start = (now - datetime.timedelta(days=WINDOW_DAYS)).strftime('%Y-%m-%dT%H:%M:%SZ')
          end = now.strftime('%Y-%m-%dT%H:%M:%SZ')

          query = '''
          query($accountTag: string, $siteTag: string, $start: Time, $end: Time) {
            viewer {
              accounts(filter: { accountTag: $accountTag }) {
                rumPageloadEventsAdaptiveGroups(
                  filter: { siteTag: $siteTag, datetime_geq: $start, datetime_leq: $end }
                  limit: 1
                ) {
                  count
                }
              }
            }
          }
          '''
          request = urllib.request.Request(
              'https://api.cloudflare.com/client/v4/graphql',
              data=json.dumps({
                  'query': query,
                  'variables': {
                      'accountTag': ACCOUNT_TAG,
                      'siteTag': SITE_TAG,
                      'start': start,
                      'end': end,
                  },
              }).encode('utf-8'),
              headers={
                  'Authorization': f"Bearer {os.environ['TOKEN']}",
                  'Content-Type': 'application/json',
              },
              method='POST',
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              result = json.loads(response.read().decode('utf-8'))

          groups = result['data']['viewer']['accounts'][0]['rumPageloadEventsAdaptiveGroups']
          count = groups[0]['count'] if groups else 0
          print(f"Page views, last {WINDOW_DAYS} days (Cloudflare Web Analytics): {count}")

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f"count={count}\n")
              handle.write(f"window_days={WINDOW_DAYS}\n")
          PY

      - name: Build browser identity resolver index
        if: steps.upstream.outputs.changed == 'true' || github.event_name == 'push' || inputs.force
        run: python build_identity_resolver.py

      - name: Build local and cloud evidence guide
        if: steps.upstream.outputs.changed == 'true' || github.event_name == 'push' || inputs.force
        run: python build_network_guide.py

      - name: Probe declared documentation and community links
        if: steps.upstream.outputs.changed == 'true' || github.event_name == 'push' || inputs.force
        run: python probe_package_links.py

      - name: Build historical package health monitor
        if: steps.upstream.outputs.changed == 'true' || github.event_name == 'push' || inputs.force
        run: python build_health_monitor.py

      # This downstream product is deliberately non-blocking: a feed rendering
      # fault must not prevent registry publication. Its builder validates all
      # inputs and promotes the comparison baseline only after outputs succeed.
      - name: Build package change feed
        if: steps.upstream.outputs.changed == 'true' || github.event_name == 'push' || inputs.force
        continue-on-error: true
        run: python build_package_feed.py

      # Contributor rankings and timelines consume only community projections.
      # A rendering failure cannot block or change Automation Map publication.
      - name: Build contributor activity view
        if: steps.upstream.outputs.changed == 'true' || github.event_name == 'push' || inputs.force
        continue-on-error: true
        run: python build_contributor_activity.py

      # These sources change independently of HPM repository metadata, so this
      # refresh runs on every scheduled main-branch workflow.
      - name: Harvest official and community catalogues
        run: python harvest_catalogues.py

      - name: Build unified package explorer
        continue-on-error: true
        run: python build_package_explorer.py

      # Provenance is built last so it describes the retained outputs promoted
      # by this run. Validation failure preserves the previous status dataset.
      - name: Build About and source-status data
        continue-on-error: true
        run: python build_site_status.py

      - name: Build package, author and update discovery pages
        run: python build_site_discovery.py

      - name: Upload catalogue outputs
        uses: actions/upload-artifact@v4
        with:
          name: hubitat-catalogue-output
          if-no-files-found: error
          path: |
            official_devices.json
            community_drivers.json
            community_apps.json
            site/package-explorer/data/explorer_index.json
            site/package-explorer/data/explorer_index.js
            hpm_taxonomy.json
            hpm_taxonomy_fallback.json
            site/taxonomy/data/hpm_taxonomy.json
            site/taxonomy/data/hpm_taxonomy.js
            hubitat_release_features.json
            site/feature-tracker/data/hubitat_release_features.json
            site/feature-tracker/data/hubitat_release_features.js
            site_status.json
            site/about/data/site_status.json
            site/about/data/site_status.js
            site/packages
            site/authors
            site/updates
            site/sitemap.xml
          retention-days: 7

      - name: Upload outputs
        if: steps.upstream.outputs.changed == 'true' || github.event_name == 'push' || inputs.force
        uses: actions/upload-artifact@v4
        with:
          name: hpm-crawl-output
          if-no-files-found: error
          path: |
            hpm_package_index.json
            hubitat_official_docs_index.json
            registry_validation_report.md
            hubitat_automation_map_app_integration_registry.json
            hubitat_automation_map_app_integration_registry_slim.json
            community_packages.json
            definitions.json
            package_health.json
            health_monitor.json
            health_summary.md
            link_reachability.json
            site/identity-resolver/data/identity_index.json
            site/identity-resolver/data/identity_index.js
            network_evidence.json
            site/network-guide/data/network_evidence.js
            contributor_activity.json
            site/contributors/data/contributor_activity.js
            package_feed_state.json
            package_changes.json
            package_changes.atom
            package_changes_weekly.md
            site/package-feed/index.html
            site/package-feed/data/package_changes.json
            site/package-feed/data/package_changes.atom
            site/package-feed/data/package_changes_weekly.md
            hpm_taxonomy.json
            hpm_taxonomy_fallback.json
            site/taxonomy/data/hpm_taxonomy.json
            site/taxonomy/data/hpm_taxonomy.js
            hubitat_release_features.json
            site/feature-tracker/data/hubitat_release_features.json
            site/feature-tracker/data/hubitat_release_features.js
            site_status.json
            site/about/data/site_status.json
            site/about/data/site_status.js
          retention-days: 7

      - name: Commit generated outputs
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # These paths are complete, deterministic regenerations, not
          # incremental edits, so there is nothing to merge: whatever this
          # run just computed is correct regardless of what else landed on
          # main while the crawl was running. Resetting to origin/main
          # (branch pointer and index only, working tree untouched) then
          # re-adding only these paths makes that explicit, instead of
          # stash/rebase, which can leave literal conflict-marker text
          # committed if a stash pop can't merge cleanly against a commit
          # pushed elsewhere while this job was running.
          GENERATED_PATHS="hpm_package_index.json hubitat_official_docs_index.json registry_validation_report.md hubitat_automation_map_app_integration_registry.json hubitat_automation_map_app_integration_registry_slim.json community_packages.json definitions.json package_health.json health_monitor.json health_summary.md link_reachability.json site/identity-resolver/data/identity_index.json site/identity-resolver/data/identity_index.js network_evidence.json site/network-guide/data/network_evidence.js contributor_activity.json site/contributors/data/contributor_activity.js package_feed_state.json package_changes.json package_changes.atom package_changes_weekly.md site/package-feed/index.html site/package-feed/data/package_changes.json site/package-feed/data/package_changes.atom site/package-feed/data/package_changes_weekly.md site/package-explorer/data/explorer_index.json site/package-explorer/data/explorer_index.js hpm_taxonomy.json hpm_taxonomy_fallback.json site/taxonomy/data/hpm_taxonomy.json site/taxonomy/data/hpm_taxonomy.js hubitat_release_features.json site/feature-tracker/data/hubitat_release_features.json site/feature-tracker/data/hubitat_release_features.js site_status.json site/about/data/site_status.json site/about/data/site_status.js site/packages site/authors site/updates site/sitemap.xml official_devices.json community_drivers.json community_apps.json upstream_state.json"

          git fetch origin main
          git reset --mixed origin/main

          # Defense in depth: catches this failure mode regardless of how
          # it happens, not just the stash/rebase path removed above.
          if grep -l -E '^(<<<<<<<|=======|>>>>>>>)' $GENERATED_PATHS 2>/dev/null; then
            echo "::error::Conflict markers found in generated output above. Aborting without committing."
            exit 1
          fi

          git add $GENERATED_PATHS
          if git diff --cached --quiet; then
            echo "No migration/output changes to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Refresh HPM crawl and community datasets [skip ci]"
            git push origin main
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # Reads the counts straight out of the page this same run just wrote,
      # rather than recomputing them, so the email can never disagree with
      # what Package Feed itself shows.
      - name: Summarise this crawl's changes
        if: steps.commit.outputs.pushed == 'true'
        id: summary
        continue-on-error: true
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          html = open('site/package-feed/index.html', encoding='utf-8').read()
          match = re.search(
              r'<strong>(\d+)</strong><span>package changes</span></div>'
              r'<div class="stat"><strong>(\d+)</strong><span>added</span></div>'
              r'<div class="stat"><strong>(\d+)</strong><span>updated</span></div>'
              r'<div class="stat"><strong>(\d+)</strong><span>availability</span></div>',
              html,
          )
          total, added, updated, availability = match.groups()
          print(f"text={total} package change(s): {added} added, {updated} updated, {availability} availability")
          PY

      # Routed through the same Gmail Notification Gateway Apps Script the
      # Hubitat driver posts to (github.com/GordonThelander/hubitat-gmail-
      # notification-gateway), rather than SMTP directly. The script sends
      # under Gordon's own Google account authorization, so it isn't subject
      # to Gmail's anti-abuse blocking of SMTP sign-ins from shared runner
      # IPs the way a raw SMTP AUTH from this job would be.
      #
      # Only the "did anything happen" ping needs to be reliable; a flaky
      # gateway call should not turn an otherwise-successful crawl run red.
      - name: Email update notification
        if: steps.commit.outputs.pushed == 'true'
        continue-on-error: true
        env:
          GATEWAY_URL: ${{ secrets.NOTIFY_GATEWAY_URL }}
          GATEWAY_TOKEN: ${{ secrets.NOTIFY_GATEWAY_TOKEN }}
          SUMMARY: ${{ steps.summary.outputs.text }}
          TRAFFIC_COUNT: ${{ steps.traffic.outputs.count }}
          TRAFFIC_WINDOW_DAYS: ${{ steps.traffic.outputs.window_days }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request


          # Apps Script Web Apps run doPost() against the original request
          # immediately, then 302-redirect to a one-time
          # script.googleusercontent.com URL that just echoes back the
          # already-computed result. Default redirect handling (curl,
          # browsers and Python's urllib alike) re-sends the request body to
          # that URL, which doesn't accept POST at all (405) - so naive
          # "follow redirects" either loses the response or fails outright.
          # The real result only needs a plain GET of the Location header.
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None


          opener = urllib.request.build_opener(NoRedirect)


          def post_json(url, payload):
              request = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode('utf-8'),
                  headers={'Content-Type': 'application/json', 'Accept': 'application/json'},
                  method='POST',
              )
              try:
                  with opener.open(request, timeout=30) as response:
                      return json.loads(response.read().decode('utf-8'))
              except urllib.error.HTTPError as error:
                  if error.code in (301, 302, 303, 307, 308):
                      location = error.headers.get('Location')
                      if not location:
                          raise
                      with urllib.request.urlopen(location, timeout=30) as response:
                          return json.loads(response.read().decode('utf-8'))
                  raise


          summary = os.environ.get('SUMMARY') or 'The scheduled crawl found real upstream changes.'
          traffic_count = os.environ.get('TRAFFIC_COUNT')
          traffic_line = (
              f"Page views, last {os.environ.get('TRAFFIC_WINDOW_DAYS')} days: {traffic_count}\n\n"
              if traffic_count else ''
          )
          body = (
              f"{summary}\n\n"
              f"{traffic_line}"
              "Package Feed: https://gordonthelander.github.io/HPM_Manifest_Crawl/package-feed/\n"
              f"This run: {os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
              f"/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          )
          payload = {
              'token': os.environ['GATEWAY_TOKEN'],
              'group': 'user',
              'subject': 'Hubitat Community Utilities updated',
              'text': body,
              'source': 'HPM Manifest Crawl',
              'fromName': 'HPM Manifest Crawl',
          }
          result = post_json(os.environ['GATEWAY_URL'], payload)
          if not result.get('ok'):
              raise RuntimeError(f"Gateway reported failure: {result.get('error')}")
          print(f"Gateway accepted: group={result.get('group')}, recipients={result.get('recipientCount')}")
          PY

  deploy-pages:
    # A push made with the default GITHUB_TOKEN does not trigger other
    # workflows, so pages.yml would never see a crawl-generated update on its
    # own. This only fires when the crawl actually changed something.
    name: Trigger Pages deployment
    if: github.ref == 'refs/heads/main' && needs.crawl.outputs.pushed == 'true'
    needs: crawl
    permissions:
      actions: write
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        # No checkout in this job, so gh has no local git context to infer
        # the repository from. --repo makes that explicit.
        run: gh workflow run pages.yml --ref main --repo ${{ github.repository }}
