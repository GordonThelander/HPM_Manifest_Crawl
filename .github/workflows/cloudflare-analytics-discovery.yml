name: Cloudflare Analytics Discovery

# One-off, manually-triggered reconnaissance for wiring up Web Analytics
# stats fetching. Prints results to the job log only - never commits or
# publishes anything. Delete this workflow once the real fetch step in
# hpm-crawl.yml is working.

on:
  workflow_dispatch: {}

jobs:
  discover:
    name: Discover account, site and schema
    runs-on: ubuntu-latest
    steps:
      - name: Query Cloudflare
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          TOKEN = os.environ['TOKEN']
          ACCOUNT_ID = 'b35cacb1572babb9b03dcf6240d409fc'
          KNOWN_BEACON_TOKEN = '4f12063038634bc29a4820bbe7523693'

          def call(method, url, body=None):
              data = json.dumps(body).encode('utf-8') if body is not None else None
              request = urllib.request.Request(
                  url,
                  data=data,
                  headers={
                      'Authorization': f'Bearer {TOKEN}',
                      'Content-Type': 'application/json',
                  },
                  method=method,
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return response.status, json.loads(response.read().decode('utf-8'))
              except urllib.error.HTTPError as error:
                  return error.code, json.loads(error.read().decode('utf-8'))

          print('=== 1. List RUM (Web Analytics) sites on this account ===')
          status, sites_result = call(
              'GET',
              f'https://api.cloudflare.com/client/v4/accounts/{ACCOUNT_ID}/rum/site_info/list',
          )
          print(f'HTTP {status}')
          print(json.dumps(sites_result, indent=2))

          print()
          print('=== 2. Try the beacon token directly as siteTag, last 30 days ===')
          import datetime
          now = datetime.datetime.now(datetime.timezone.utc)
          start = (now - datetime.timedelta(days=30)).strftime('%Y-%m-%dT%H:%M:%SZ')
          end = now.strftime('%Y-%m-%dT%H:%M:%SZ')
          rum_query = '''
          query($accountTag: string, $siteTag: string, $start: Time, $end: Time) {
            viewer {
              accounts(filter: { accountTag: $accountTag }) {
                rumPageloadEventsAdaptiveGroups(
                  filter: { siteTag: $siteTag, datetime_geq: $start, datetime_leq: $end }
                  limit: 1
                ) {
                  count
                }
              }
            }
          }
          '''
          status, rum_result = call(
              'POST',
              'https://api.cloudflare.com/client/v4/graphql',
              {
                  'query': rum_query,
                  'variables': {
                      'accountTag': ACCOUNT_ID,
                      'siteTag': KNOWN_BEACON_TOKEN,
                      'start': start,
                      'end': end,
                  },
              },
          )
          print(f'HTTP {status}')
          print(json.dumps(rum_result, indent=2))
          PY
